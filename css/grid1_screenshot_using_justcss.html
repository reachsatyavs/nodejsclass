<!DOCTYPE html>
<html>
<head>
  <title>Proportional Grid Layout</title>


  <style>
    body {
      margin: 0;
      background: #222;
      padding: 30px;
    }

    .layout {
      display: grid;
      width: 100%;
      max-width: 1200px;
      height: 600px;
      margin: auto;
      background: #333;
      padding: 18px;
      gap: 18px;

      grid-template-columns: 1fr 1fr 0.65fr 1fr 1fr;
      grid-template-rows: 1fr 1.4fr 1fr;
    }

    .block {
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 6rem;
      font-weight: bold;
      color: #fff;
    }

    .block.d,
    .block.f {
      color: #222;
    }

    .a {
      grid-column: 1 / 2;
      grid-row: 1 / 3;
      background: #f24d3f;
    }

    .b {
      grid-column: 2 / 4;
      grid-row: 1 / 2;
      background: #48c6cc;
    }

    .c {
      grid-column: 4 / 6;
      grid-row: 1 / 2;
      background: #d8bf74;
    }

    .d {
      grid-column: 1 / 2;
      grid-row: 3 / 4;
      background: #ffffff;
    }

    .e {
      grid-column: 2 / 3;
      grid-row: 2 / 3;
      background: #d8bf74;
    }

    .f {
      grid-column: 3 / 5;
      grid-row: 2 / 3;
      background: #ffffff;
    }

    .g {
      grid-column: 5 / 6;
      grid-row: 2 / 4;
      background: #f24d3f;
    }

    .h {
      grid-column: 2 / 4;
      grid-row: 3 / 4;
      background: #f24d3f;
    }

    .i {
      grid-column: 4 / 5;
      grid-row: 3 / 4;
      background: #48c6cc;
    }
  </style>
</head>

<body>

  <div class="layout">
    <div class="block a">A</div>
    <div class="block b">B</div>
    <div class="block c">C</div>
    <div class="block d">D</div>
    <div class="block e">E</div>
    <div class="block f">F</div>
    <div class="block g">G</div>
    <div class="block h">H</div>
    <div class="block i">I</div>
  </div>

</body>
</html>
