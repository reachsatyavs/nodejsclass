<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bootstrap Grid Layout</title>

    <!-- Bootstrap CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        margin: 0;
        background: #222;
        padding: 30px;
      }

      .cell {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 2px;
        font-size: 2rem;
        font-weight: bold;
      }

      .cell-red {
        background: #f24d3f;
        color: #fff;
      }

      .cell-teal {
        background: #48c6cc;
        color: #fff;
      }

      .cell-tan {
        background: #d8bf74;
        color: #222;
      }

      .cell-white {
        background: #ffffff;
        color: #222;
      }
    </style>
  </head>
  <body>
    <!--
      Same mosaic as CSS grid version.
      Uses Bootstrap row + col-* only (12 columns total).
      Main split: col-3 + col-9, then nested rows inside col-9.
    -->
    <div class="container-fluid bg-dark p-3 rounded" style="max-width: 1200px">
      <p class="text-white-50 small text-center mb-2">
        Bootstrap grid — <code>col-3</code> + <code>col-9</code> = 12
      </p>

      <div class="row g-2" style="min-height: 560px">
        <!-- LEFT: col-3 — A and D stacked (col-12 each) -->
        <div class="col-3">
          <div class="row g-2 h-100 flex-column">
            <div class="col-12 flex-fill">
              <div class="cell cell-red h-100">A</div>
            </div>
            <div class="col-12 flex-fill">
              <div class="cell cell-white h-100">D</div>
            </div>
          </div>
        </div>

        <!-- RIGHT: col-9 — B, C, E, F, G, H, I -->
        <div class="col-9 d-flex flex-column gap-2">
          <!-- Row 1: B + C = col-5 + col-7 = 12 -->
          <div class="row g-2">
            <div class="col-5">
              <div class="cell cell-teal">B</div>
            </div>
            <div class="col-7">
              <div class="cell cell-tan">C</div>
            </div>
          </div>

      
          <div class="row g-2 flex-grow-1">
            <div class="col-4">
              <div class="cell cell-tan h-100">E</div>
            </div>
            <div class="col-5">
              <div class="cell cell-white h-100">F</div>
            </div>
            <div class="col-3">
              <div class="cell cell-red h-100">G</div>
            </div>
          </div>


          <div class="row g-2">
            <div class="col-8">
              <div class="cell cell-red">H</div>
            </div>
            <div class="col-4">
              <div class="cell cell-teal">I</div>
            </div>
          </div>
        </div>
      </div>

    </div>


  </body>
</html>
