<!DOCTYPE html>
<html lang="en">
<head>

  <title>Flexbox</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #8b8888;
      font-family: Georgia, serif;
      padding: 40px 20px;
    }

    h1 {
      text-align: center;
      font-size: 1.4rem;
      margin-bottom: 40px;
    }

    .demo {
      max-width: 520px;
      margin: 0 auto 50px;
    }

    .demo h2 {
      font-size: 0.9rem;
      font-weight: normal;
      margin-bottom: 12px;
    }

    .box {
      width: 60px;
      height: 60px;
    }

    .a { background: #c0392b; }
    .b { background: #e0e32b; }
    .c { background: #1b6e1a; }

    .row {
      display: flex;
      flex-direction: row;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      background: #ddd;
    }

    .col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 20px;
      background: #ddd;
    }

    .col .box {
      width: 200px;
      height: 50px;
    }

    .diag {
      display: flex;
 
      justify-content: center;
      gap: 24px;
      padding: 20px;
      background: #ddd;
      min-height: 200px;

    }

    .diag .b { margin-top: 50px; }
    .diag .c { margin-top: 100px; }
  </style>
</head>
<body>

  <h1>Flexbox (3)</h1>

  <div class="demo">
    <h2>Row justify-content: center</h2>
    <div class="row">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>

  <div class="demo">
    <h2>Column align-items: center</h2>
    <div class="col">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>

  <div class="demo">
    <h2>Diagonal  row + margin-top on b and c</h2>
    <div class="diag">
      <div class="box a"></div>
      <div class="box b"></div>
      <div class="box c"></div>
    </div>
  </div>

</body>
</html>
